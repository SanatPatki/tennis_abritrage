services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://bot:bot@db:5432/tennis
    depends_on:
      - db
    volumes:
      - ../data/raw:/app/data/raw

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: tennis
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"

volumes:
  pgdata:

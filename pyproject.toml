[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "cryptography>=42",
    "pydantic>=2",
    "pandas>=2",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
    "rapidfuzz>=3",
    "unidecode>=1.3",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
